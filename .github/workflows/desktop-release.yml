name: desktop-windows

# Fork-only Windows desktop binaries. Independent from v* PyPI/npm releases.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop-release.yml"
      - "apps/desktop-client/**"
      - "coding_tools_mcp/**"
      - "tests/test_desktop_packaging.py"
      - "tests/test_desktop_enhancements.py"
      - "tests/test_oauth_client_persistence.py"
      - "pyproject.toml"
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      # A change to this explicit request file triggers one verified release.
      # Path filters do not apply to tag pushes.
      - "apps/desktop-client/packaging/release-request.txt"

permissions:
  contents: read

jobs:
  windows:
    name: Build and smoke Windows installer
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Install packaging toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          python -m pip install "pyinstaller>=6.15,<7"
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup" }
      - name: Check desktop source tests and translations
        shell: pwsh
        run: |
          python -m unittest tests.test_desktop_packaging tests.test_desktop_enhancements tests.test_oauth_client_persistence tests.test_desktop_client
          if ($LASTEXITCODE -ne 0) { throw "Desktop regression suite failed" }
          python scripts/check_desktop_i18n.py
          if ($LASTEXITCODE -ne 0) { throw "Desktop i18n check failed" }
      - name: Validate isolated desktop release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-client/packaging/desktop-version.txt -Raw).Trim()
          if ("desktop-v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag $env:GITHUB_REF_NAME must equal desktop-v$version"
          }
      - name: Freeze GUI and server; build installer
        shell: pwsh
        run: |
          & apps/desktop-client/packaging/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop build failed" }
      - name: Smoke portable and installed application
        shell: pwsh
        run: |
          $root = (Resolve-Path "build/desktop-pyinstaller/staging/CodingToolsMCP").Path
          $installer = (Get-ChildItem "dist/desktop-release" -Filter "*_Setup.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "Installer not produced" }
          & apps/desktop-client/packaging/smoke-windows.ps1 -AppDir $root -Installer $installer
          # PowerShell script errors terminate the step; LASTEXITCODE is unset here.
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CodingToolsMCP-Desktop-Windows-x64
          path: |
            dist/desktop-release/*_Setup.exe
            dist/desktop-release/*_Portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish fork-only desktop release
    needs: windows
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/desktop-v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7.0.1
        with:
          name: CodingToolsMCP-Desktop-Windows-x64
          path: release-assets
      - name: Resolve and verify requested desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\\r\\n' < apps/desktop-client/packaging/desktop-version.txt)"
          tag="desktop-v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "Tag and version mismatch" >&2; exit 1; }
          else
            requested="$(tr -d '\\r\\n' < apps/desktop-client/packaging/release-request.txt)"
            [[ "$requested" == "$tag" ]] || { echo "Release request mismatch: $requested != $tag" >&2; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create tagged GitHub Release with tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          args=(--repo "$GITHUB_REPOSITORY"
                --title "Coding Tools MCP Desktop $RELEASE_TAG (Windows x64)"
                --latest
                --notes "Windows x64 installer and portable ZIP for this fork. Includes Python, PySide6 GUI and MCP Server. Existing workspace and OAuth configuration is kept on upgrade. Binaries are unsigned; Windows SmartScreen may warn. External cloudflared/FRP is not bundled. Upstream PyPI/npm release pipeline is unaffected.")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--verify-tag)
          else
            # gh release create also creates the tag. GITHUB_TOKEN tag pushes
            # do not start a second workflow; this single CI job publishes once.
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
